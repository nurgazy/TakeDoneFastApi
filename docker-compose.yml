services:
  migration_runner:
    build: .
    image: takedone_img:latest
    container_name: takedone_migrations
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    volumes:
      - .:/app
    command: alembic upgrade head
    depends_on:
      postgres_db:
        condition: service_healthy

  fastapi_app:
    build: .
    image: takedone_img:latest
    container_name: TakeDone
    ports:
      - "8008:8008"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8008", "--reload"]
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
      migration_runner:
        condition: service_completed_successfully

  postgres_db:
    image: postgres:16-alpine
    container_name: takedone_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: